		  <script type="text/javascript">
			window.onload = init;
			function init() {
				if (window.Event) {
				document.captureEvents(Event.MOUSEMOVE);
				}
				document.onmousemove = getCursorXY;
			}
			
			function getCursorXY(e) {
				document.getElementById('cursorX').value = (window.Event) ? e.pageX : event.clientX + (document.documentElement.scrollLeft ? document.documentElement.scrollLeft : document.body.scrollLeft);
				document.getElementById('cursorY').value = (window.Event) ? e.pageY : event.clientY + (document.documentElement.scrollTop ? document.documentElement.scrollTop : document.body.scrollTop);
			}
			</script>
	    
	    <script type="text/javascript">
	        
	            ////////// SETUP
	            mapLink = './images/maps/{id}/{z}/{x}/{y}.gif';
	
	            var layer  = L.tileLayer(mapLink, {id: 'layer', noWrap: true}), 
					layer2  = L.tileLayer(mapLink, {id: 'layer2', noWrap: true}), 
					layer3  = L.tileLayer(mapLink, {id: 'layer3', noWrap: true}), 
					layer4  = L.tileLayer(mapLink, {id: 'layer4', noWrap: true}); 
	
	            var map = L.map('map', {center: [-48.8, -1.4], zoom: 1, minZoom: 1, maxZoom: 5}).addLayer(layer);
	
	            var baseLayers = {"layer": layer, "layer2": layer2, "layer3": layer3,"layer4": layer4};
	            
	            var markerArray = [];
	            var projArray = [];
	            
	            var projectIcon = L.icon({
	            	iconUrl: 'js/images/info.png',
	            	iconRetinaUrl: 'js/images/info.png',
	            	iconSize:     [23, 23],
				    iconAnchor:   [11, 23],
				    popupAnchor:  [1, -23]
	            	});
	            	
	            var regIcon = L.icon({
	            	iconUrl: 'js/images/marker-icon.png',
	            	iconRetinaUrl: 'js/images/marker-icon-2x.png',
	            	iconSize:     [25, 42],
				    iconAnchor:   [13, 42],
				    popupAnchor:  [1, 0]
	            	});
	            	           
	            var southWest = map.unproject([0, 8192], map.getMaxZoom());
	            var northEast = map.unproject([8192, 0], map.getMaxZoom());
	            map.setMaxBounds(new L.LatLngBounds(southWest, northEast));

				console.log('Tile URL template:', mapLink);
console.log('Current map center:', map.getCenter());
console.log('Current zoom:', map.getZoom());
console.log('Icon paths:', {
    projectIcon: projectIcon.options.iconUrl,
    regIcon: regIcon.options.iconUrl
});

layer.on('tileloadstart', function(e) {
    console.log('Loading tile:', e.url);
});

layer.on('tileerror', function(e) {
    console.error('Tile failed to load:', e.tile.src);
});

				///////// LAYERZ CONTROL
	            //CYCLE THRU THEM LAYAZ
	            var cycle = 0;
	            
	            var cycling = function() {
	            	if (cycle < 3) {cycle++} else {cycle = 0};
	                    
	                if (cycle == 0) {
	                    map.addLayer(layer);
	                    map.removeLayer(layer4);
	                    $('#layerz').css('background', 'url("img/Z000b.png") no-repeat center center #fff');
						$('#layerz').css('background-color', '#0000');
	                }
	                
	                if (cycle == 1) {
	                    map.removeLayer(layer);
	                    map.addLayer(layer2);
	                    $('#layerz').css('background','url("img/Z001b.png") no-repeat center center #fff');
						$('#layerz').css('background-color', '#0000');
	                }
	                
					if (cycle == 2) {
	                    map.removeLayer(layer2);
	                    map.addLayer(layer3);
	                    $('#layerz').css('background','url("img/Z002b.png") no-repeat center center #fff');
						$('#layerz').css('background-color', '#0000');
	                }
					if (cycle == 3) {
	                    map.removeLayer(layer3);
	                    map.addLayer(layer4);
	                    $('#layerz').css('background','url("img/Z003b.png") no-repeat center center #fff');
						$('#layerz').css('background-color', '#0000');
	                }
	 
	            }; 
	            
	            
	            //BUTTON CYCLE
	            $('#layerz').click(function() {cycling();});
